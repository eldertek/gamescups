name: PHP Security & Lint CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: PHP syntax and deprecation lint
        run: find . -path ./vendor -prune -o -name "*.php" -print0 | xargs -0 -n1 php -d error_reporting=E_ALL -l

      - name: Run OWASP S-SDLC security suite
        run: php -d error_reporting=E_ALL tests/SecurityAuditTest.php
